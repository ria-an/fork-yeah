<!DOCTYPE html>
<html lang="ru">
<head><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Fork Yeah"><link rel="icon" type="image/png" href="icon-192.png"><meta name="color-scheme" content="light">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff">
<title>Fork Yeah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Unbounded:wght@800&display=swap" rel="stylesheet">
<style>
:root{
  /* Тёплый светлый «рабочий стол»: серая подложка → рамка приложения → серые лотки → белые карточки. Монохром, тонкие линии, цифры моноширинным. Одна светлая тема. */
  --page:#e9e7e2; --shell:#f6f5f2; --tray:#f1f0ec; --panel:#ffffff;
  --line:#e3e1dc; --line-2:#d6d4ce; --ink:#1b1b19; --ink-2:#3d3c39; --muted:#77766f; --faint:#a3a29b;
  --green:#3c9a68; --amber:#c9822b; --blue:#4a72c9; --teal:#2f8f86;
  --font:"Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --mono:"Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,[role=button],a,label,summary{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button,[role=button],summary,.tag,.navitem,.utabs button,.tabbar button,.eatbtn,.stchk,.chk{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
@media (pointer:coarse){input,textarea,select{font-size:16px!important}}
@media (max-width:860px){html,body{overscroll-behavior-y:none}}
.sheet{overscroll-behavior:contain}
dialog .sheet{will-change:transform}
html,body{margin:0;height:100%}
body{background:var(--page);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12.5px}

/* frame */
.frame{max-width:1320px;margin:24px auto;min-height:calc(100% - 48px);background:var(--shell);border:1px solid var(--line);border-radius:16px;display:grid;grid-template-columns:232px minmax(0,1fr);overflow:hidden}
.side{padding:14px 12px;display:flex;flex-direction:column;gap:4px}
.ws{all:unset;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);background:var(--panel);border-radius:10px;margin-bottom:12px}
.ws .logo{width:30px;height:30px;border-radius:7px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px}
.ws small{display:block;font-size:11px;color:var(--muted)}
.ws b{display:block;font-weight:500;font-size:13.5px}
.ws svg{margin-left:auto;color:var(--faint)}
.navlabel{font-size:12px;color:var(--muted);padding:12px 8px 4px}
.navitem{all:unset;box-sizing:border-box;width:100%;height:34px;cursor:pointer;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:8px;border:1px solid transparent;color:var(--ink-2);font-size:13.5px}
.navitem svg{color:var(--muted);flex:none}
.navitem[aria-current="page"] svg{color:var(--ink)}
#nav{display:grid;gap:2px}
@media (hover:hover) and (pointer:fine){.navitem:hover:not([aria-current="page"]){background:rgba(27,27,25,.04);color:var(--ink)}}
.navitem[aria-current="page"]{background:var(--panel);border-color:var(--line);box-shadow:0 1px 2px rgba(27,27,25,.04);color:var(--ink);font-weight:500}
.navitem .cnt{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding:12px 8px 2px;display:grid;gap:2px;font-size:12.5px}
.side-foot button:not(.navitem){all:unset;cursor:pointer;color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2)}
.main{grid-template-columns:minmax(0,1fr);background:var(--panel);margin:8px 8px 8px 0;border:1px solid var(--line);border-radius:12px;padding:22px 28px 40px;min-width:0;display:grid;gap:18px;align-content:start}
.crumbs{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.crumbs b{color:var(--ink);font-weight:500}
.crumb{all:unset;cursor:pointer;color:var(--muted);text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
@media (hover:hover) and (pointer:fine){.crumb:hover{color:var(--ink)}}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
h1{font-size:32px;line-height:1.1;font-weight:500;letter-spacing:-.025em;margin:0;text-wrap:balance}
h2{font-size:15px;font-weight:500;margin:0;letter-spacing:-.005em}
.headacts{display:flex;gap:8px;flex-wrap:wrap}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);font-size:13px;font-weight:500;white-space:nowrap}
@media (hover:hover) and (pointer:fine){.btn:hover{background:var(--shell)}}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
@media (hover:hover) and (pointer:fine){.btn.dark:hover{background:#000}}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn.run{background:var(--ink);color:#fff;border-color:var(--ink)}
.utabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.utabs button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;padding:9px 10px;margin-bottom:-1px;font-size:13.5px;color:var(--muted);border-bottom:1.5px solid transparent;white-space:nowrap}
.tsep{flex:none;width:1px;align-self:center;height:16px;background:var(--line-2);margin:0 6px}
.utabs button small{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.utabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.mtop{display:none}
.msect{display:none}

/* tray + cards */
.tray{background:var(--tray);border:1px solid var(--line);border-radius:12px;padding:6px}
.trayhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px 10px}
h2 .cnt{font-family:var(--mono);font-size:11.5px;color:var(--muted);border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:1px 6px;margin-left:6px}
.inner{background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.rowi{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);min-height:46px}
.rowi:first-child{border-top:0}
button.rowi{all:unset;color:var(--ink);cursor:pointer;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line);min-height:46px}
button.rowi:first-child{border-top:0}
@media (hover:hover) and (pointer:fine){button.rowi:hover{background:var(--shell)}}
.rowi .grow{flex:1;min-width:0}
.rowi .ic{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-2);background:var(--panel)}
.rowi .sub{font-size:12.5px;color:var(--muted)}
.rowi .chev{color:var(--faint)}
.tag{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border:1px solid var(--line-2);border-radius:999px;font-size:11.5px;color:var(--ink-2);background:var(--panel);white-space:nowrap}
.tag svg.i{width:12px;height:12px}
.tag.hi{border-color:#f0d9b8;background:#fbf3e7;color:#8a5a1c}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:var(--tray);border:1px solid var(--line);border-radius:12px;padding:5px;display:grid}
.kpi .in{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px 14px;display:grid;gap:6px}
.kpi .lab{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi .val{font-family:var(--mono);font-size:24px;font-weight:500;letter-spacing:-.02em}
.kpi .val small{font-size:12px;color:var(--muted);font-family:var(--font);letter-spacing:0;margin-left:4px;font-weight:400}
.kpi .foot{display:flex;justify-content:space-between;align-items:center;padding:7px 9px 3px;font-size:12px;color:var(--muted)}
.bar{height:5px;border-radius:3px;background:#ecebe7;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:3px}
.bar.ink i{background:var(--ink)}

/* meals board */
.tray{container-type:inline-size}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@container (min-width:500px){}
@container (min-width:500px){.cols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container (min-width:1000px){.cols{grid-template-columns:repeat(4,minmax(0,1fr))}}
.mcard{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;display:grid}
.mcard{overflow:hidden}
.mcard .open{all:unset;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;height:100%;box-sizing:border-box}
.mbody{display:flex;flex-direction:column;gap:8px;padding:12px 14px 12px;flex:1}
@media (hover:hover) and (pointer:fine){.mcard .open:hover .dish{text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}}
.mhead{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.mhead .k{margin-left:auto;font-family:var(--mono);font-size:12px}
.dish{font-size:16px;line-height:1.3;font-weight:500;letter-spacing:-.01em;padding-right:4px}
.how{font-size:12.5px;line-height:1.5;color:var(--ink-2)}
.mfoot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-top:4px;margin-top:auto}
.status{all:unset;color:var(--ink);cursor:pointer;width:28px;height:28px;display:grid;place-items:center;margin:-6px -4px -6px -6px;border-radius:50%}
.status span{width:16px;height:16px;border-radius:50%;border:1.6px dashed var(--faint);display:grid;place-items:center}
.status[aria-pressed="true"] span{border:0;background:var(--green)}
.status[aria-pressed="true"] span::after{content:"";width:4px;height:8px;border:solid #fff;border-width:0 1.6px 1.6px 0;transform:rotate(45deg) translate(-.5px,-1px)}
.eatbtn{all:unset;cursor:pointer;margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px 0 7px;border:1px solid var(--line-2);border-radius:999px;font-size:12px;color:var(--ink-2);background:var(--panel)}
.eatbtn .dot{width:12px;height:12px;border-radius:50%;border:1.5px dashed var(--faint);display:grid;place-items:center}
@media (hover:hover) and (pointer:fine){.eatbtn:hover{border-color:var(--ink-2)}}
.eatbtn[aria-pressed="true"]{border-color:#cfe5d8;background:#eef7f1;color:#2c7a51}
.eatbtn[aria-pressed="true"] .dot{border:0;background:var(--green)}
.eatbtn[aria-pressed="true"] .dot::after{content:"";width:3px;height:6px;border:solid #fff;border-width:0 1.5px 1.5px 0;transform:rotate(45deg) translate(-.5px,-.5px)}
.mcard.done .dish{color:var(--muted)}

/* week kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,1fr);gap:10px;overflow-x:auto;padding-bottom:4px}
.kcol{background:var(--tray);border:1px solid var(--line);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:6px}
.kcol.today{border-color:var(--ink)}
.khead{display:flex;align-items:center;gap:8px;padding:6px 8px 4px}
.khead b{font-weight:500}
.khead .k{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.kcard{all:unset;color:var(--ink);cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px;display:grid;gap:6px}
@media (hover:hover) and (pointer:fine){.kcard:hover{border-color:var(--line-2)}}
.kcard .dish{font-size:13.5px}
.kevent{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px dashed var(--line-2);border-radius:9px;font-size:12.5px;color:var(--ink-2)}
@media (hover:hover) and (pointer:fine){.kevent:hover{background:var(--panel)}}
.daylist{display:none}

/* cook */
.cookgrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.aside{display:grid;gap:12px;position:sticky;top:16px}
.step{display:grid;grid-template-columns:76px 1fr;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step .sl{display:flex;align-items:flex-start;gap:10px}
.step .t{font-family:var(--mono);font-size:13px;color:var(--muted);padding-top:3px}
.stchk{all:unset;box-sizing:border-box;cursor:pointer;flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-2);background:var(--panel);display:grid;place-items:center;transition:background-color 150ms ease,border-color 150ms ease,transform 160ms var(--ease-out,ease)}
@media (hover:hover) and (pointer:fine){.stchk:hover{border-color:var(--ink-2)}}
.stchk:active{transform:scale(.92)}
.stchk[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
.stchk[aria-pressed="true"]::after{content:"";width:4px;height:8px;border:solid #fff;border-width:0 1.8px 1.8px 0;transform:rotate(45deg) translate(-1px,-1px)}
.step.cur .stchk{border-color:var(--ink)}
.tbtn span{font-variant-numeric:tabular-nums;min-width:9ch}
.step .body{display:grid;gap:8px}
.step .txt{font-size:14.5px;line-height:1.45}
.step .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.step .acts{display:flex;gap:6px;flex-wrap:wrap}
.step.cur{background:#fbfaf7;box-shadow:inset 2px 0 0 var(--ink)}
.step.cur .t{color:var(--ink)}
.step.done .body{opacity:.5}
.step.done .txt{text-decoration:line-through}
.timerow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.timerow:first-child{border-top:0}
.timerow .mono{font-size:20px;min-width:72px;font-variant-numeric:tabular-nums}
.timerow .tlabel{flex:1;min-width:0;font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timerow .tlabel b{font-weight:500;color:var(--green)}
.timerow .btn{flex:none}
.timerow.end .mono{color:var(--green)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:12px}
.chips span{border:1px solid var(--line);border-radius:7px;padding:4px 8px;font-size:12.5px;background:var(--panel)}
details.fold summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 10px 10px}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary .chev{margin-left:auto;transition:transform .15s;color:var(--faint)}
details.fold[open] summary .chev{transform:rotate(90deg)}

/* shop */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-weight:400;font-size:12.5px;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line)}
.tbl td{padding:0 14px;height:46px;border-top:1px solid var(--line);font-size:13.5px}
.tbl tr:first-child td{border-top:0}
.tbl .num{text-align:right;font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.tbl .qty{color:var(--muted);white-space:nowrap}
.chk{display:flex;align-items:center;gap:12px;cursor:pointer;min-height:46px}
.chk input{position:absolute;opacity:0;width:1px;height:1px}
.chk .box{flex:none;width:16px;height:16px;border-radius:4px;border:1.5px solid var(--line-2);display:grid;place-items:center;background:var(--panel)}
.chk input:checked+.box{background:var(--ink);border-color:var(--ink)}
.chk input:checked+.box::after{content:"";width:4px;height:8px;border:solid #fff;border-width:0 1.6px 1.6px 0;transform:rotate(45deg) translate(-.5px,-1px)}
.chk input:focus-visible+.box{outline:2px solid var(--ink);outline-offset:2px}
tr.got td{color:var(--faint)}
tr.got .name{text-decoration:line-through}

/* recipes */
.search{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--panel);min-width:240px}
.search input{border:0;outline:0;font:inherit;flex:1;min-width:0;background:transparent;color:var(--ink)}
.search kbd{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
details.rd{border-top:1px solid var(--line)}
details.rd:first-child{border-top:0}
details.rd summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:46px}
details.rd summary::-webkit-details-marker{display:none}
details.rd summary .chev{color:var(--faint);transition:transform .15s}
details.rd[open] summary .chev{transform:rotate(90deg)}
@media (hover:hover) and (pointer:fine){details.rd summary:hover{background:var(--shell)}}
.rec{padding:2px 14px 18px 42px;display:grid;gap:14px}
.rec .vibe,.rec .steps{max-width:72ch}
.rname{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.rname .media.ty.sm{flex:none}
.rmeta{text-align:right}
.vibe{margin:0;font-size:14.5px;line-height:1.5;color:var(--ink)}
.rsec{display:grid;gap:8px}
.rh{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ings{display:flex;flex-wrap:wrap;gap:6px}
.ings .tag{height:26px;font-size:12.5px;padding:0 10px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:st}
.steps li{counter-increment:st;display:grid;grid-template-columns:24px 1fr;gap:10px;line-height:1.5;color:var(--ink-2)}
.steps li::before{content:counter(st);width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;font:500 11.5px/22px var(--mono);text-align:center;margin-top:1px}
.tip{display:flex;gap:10px;align-items:baseline;padding:10px 12px;border-radius:10px;background:#fff6d9;border:1px solid #f3e2a6;color:#5a4500;font-size:13.5px;line-height:1.45}
.tip b{font-family:'Unbounded',var(--font);font-weight:800;font-size:11px;letter-spacing:.02em;text-transform:uppercase;flex:none}
.rmeta-m{display:none}
@media (max-width:560px){.rec{padding:2px 14px 16px 14px}.rmeta{display:none}.rmeta-m{display:block;margin-bottom:-6px}}

/* sheet */
dialog{border:0;padding:0;background:transparent;color:var(--ink);font:inherit;max-width:none;max-height:none;width:100%;height:100%;margin:0;overflow:hidden}
dialog::backdrop{background:rgba(27,27,25,.28)}
.sheet{color:var(--ink);position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 32px));max-height:86%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:16px;box-shadow:0 24px 60px rgba(27,27,25,.16)}
.sheet > *{min-width:0}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.shead h2{margin:0;color:var(--ink);font-size:20px;letter-spacing:-.02em;line-height:1.25}
.x{all:unset;box-sizing:border-box;cursor:pointer;width:30px;height:30px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none}
.grab{display:none}
.mbju{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mbju div{padding:10px 12px;border-left:1px solid var(--line);display:grid;gap:2px}
.mbju div:first-child{border-left:0}
.mbju b{color:var(--ink);font-family:var(--mono);font-weight:500;font-size:18px}
.mbju span{font-size:11px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em}
.field{display:grid;gap:6px}
.field label{font-size:12.5px;color:var(--muted)}

/* ---------- Правила формата меню (для ИИ) ---------- */
const RULES_MD="# Формат меню для импорта\n\nЭтот документ можно целиком отдать любой нейросети (Claude, ChatGPT, Gemini и т. д.) с просьбой: «Собери новое меню по этим правилам». Здесь описано всё, что ей нужно знать.\n\n## 1. Что это и что нужно получить\n\nЕсть приложение Fork Yeah. Это план питания на 4 недели для одного человека. Еда готовится заранее, 2 раза в неделю. Всё остальное либо достаётся из морозилки, либо собирается за 5 минут.\n\nМеню загружается в приложение одним файлом JSON. Где загрузить: «Настройки → Общие → Добавить меню». Кнопка «Шаблон» там же скачивает встроенное Меню 1 в этом формате. Это полный рабочий пример: если он есть, сверяйся с ним.\n\nОт нейросети нужно:\n1. Один файл `menu-<id>.json`. Только валидный JSON: без комментариев, без висячих запятых, только двойные кавычки.\n2. 2–3 строки текстом о том, что в меню нового.\n\nПеред тем как отдать файл, нейросеть проверяет его по чек-листу из раздела 6. Приложение тоже проверяет файл при загрузке и показывает ошибки.\n\n## 2. Как устроен план (нужно для понимания полей)\n\n- План длится 4 недели по 7 дней. Дни нумеруются от 0 до 6 внутри недели. День 0 — первый день недели плана, не обязательно понедельник: реальные дни недели пользователь выбирает в настройках.\n- Каждый день 4 приёма пищи, всегда в одном порядке: завтрак, обед, полдник, ужин.\n- В неделю 2 готовки:\n  - готовка 1 — вечером накануне недели, она кормит начало недели;\n  - готовка 2 — вечером дня 3, она кормит конец недели.\n- У каждого приёма указано, откуда берётся еда: из готовки 1, из готовки 2, из морозилки или «собрать на месте за 5 минут».\n- Вечером накануне некоторых дней что-то перекладывают из морозилки в холодильник (поле pull).\n\n## 3. Структура файла\n\nВерхний уровень — один объект с полями:\n\n```\n{\n  \"format\": \"mealplan-menu\",   // всегда ровно так\n  \"version\": 1,                // всегда 1\n  \"id\": \"m2-winter\",           // см. ниже\n  \"name\": \"Меню 2 · зима\",     // название в списке меню\n  \"weeks\":   [...],            // 4 недели\n  \"dishes\":  {...},            // словарь всех блюд\n  \"cooks\":   [...],            // 4 недели × 2 готовки\n  \"pull\":    [...],            // 4 объекта\n  \"cookDays\": [0, 3],          // всегда [0, 3]\n  \"shop\":    [...],            // 4 списка покупок\n  \"pantry\":  [...],            // крупы на месяц\n  \"recipes\": [...]             // рецепты\n}\n```\n(Комментарии `//` здесь только для пояснения. В файле их быть не должно.)\n\nid: строчная латиница, цифры и дефис, от 2 до 24 символов. \"m1\" занят встроенным меню. Если загрузить файл с уже существующим id, меню обновится, а не добавится второй раз.\n\n### 3.1 weeks — что едим\n\nМассив ровно из 4 недель. Неделя — `{ \"days\": [7 дней] }`. День — `{ \"meals\": [4 приёма], \"t\": [ккал, белки, жиры, углеводы] }`.\n\nПриём:\n```\n{ \"id\": \"H_chick_buck\",\n  \"n\": \"Курица с паприкой, гречка, морковный салат, сметанный соус\",\n  \"k\": 525, \"p\": 44, \"f\": 15, \"c\": 53,\n  \"s\": \"s\" }\n```\n- id — ключ блюда из dishes. Одно и то же блюдо в разные дни имеет один id.\n- n — полное название, которое видно в карточке.\n- k, p, f, c — ккал, белки, жиры и углеводы в граммах. Только числа, без кавычек.\n- s — откуда еда, одна буква:\n  - \"s\" — из готовки 1;\n  - \"w\" — из готовки 2;\n  - \"f\" — из морозилки;\n  - \"q\" — собрать за 5 минут без заготовки.\n- t — итог дня. t[0] должен совпадать с суммой k четырёх приёмов (допуск ±10). t[1..3] — суммы белков, жиров и углеводов.\n\n### 3.2 dishes — карточки блюд\n\nОбъект, где ключ — id блюда. В dishes должен быть каждый id, который встречается в weeks.\n```\n\"H_chick_buck\": {\n  \"how\": \"Курицу и гречку из контейнера — 2 мин в микроволновке. Салат и соус добавить холодными.\",\n  \"recipe\": \"chicken\",\n  \"short\": \"КУРИ|ЦА\",\n  \"art\": \"grain\"\n}\n```\n- how — как подать: 1–2 фразы о том, что разогреть, сколько минут и что добавить.\n- recipe — id рецепта из recipes. Если отдельного рецепта нет — null.\n- short — 1–2 слова заглавными для цветной плашки. Символ «|» обозначает перенос строки: \"СЫР|НИКИ\", \"ПЛОВ\".\n- art — тип блюда, от него зависит цвет плашки. Только одно из значений: grain, cutlets, oven, pasta, bake, bake2, soup, salad, eggs, toast, oat, yogurt, syrniki, cottage, cookies, smoothie, apple.\n\n### 3.3 cooks — готовки\n\nМассив из 4 недель, в каждой ровно 2 готовки: первая — готовка 1, вторая — готовка 2. Готовка — объект `{ need, steps, out, pack }`.\n\nneed — продукты на эту готовку. Каждый продукт — одна строка с количеством:\n```\n[\"Куриная грудка 450 г\", \"Фарш куриный 700 г\", \"Творог 600 г\"]\n```\n\nsteps — шаги в порядке выполнения. Каждый шаг — массив из 6 элементов:\n```\n[0, \"Духовка\", \"Разогрей духовку и поставь свёклу\", 60, null,\n \"Включи духовку на 200°. Свёклу помой, но не чисть. Плотно заверни целиком в фольгу и положи прямо на решётку.\"]\n```\n1. Минута от начала готовки, когда начинать шаг (число). Шаги могут идти параллельно: пока что-то в духовке, следующий шаг на столе.\n2. Место — только одно из трёх: \"Духовка\", \"Плита\", \"Стол\".\n3. Заголовок — короткое действие, оно же подпись таймера.\n4. Сколько минут ждать (число). Если ждать не нужно — 0. Если больше 0, приложение запускает таймер.\n5. id рецепта из recipes, если шаг по нему, иначе null.\n6. «Подробно» — полное объяснение шага (правила в разделе 4).\n\nout — что получится. Каждая строка — `[\"что\", \"fr\" или \"fz\", \"на какие приёмы\"]`:\n- \"fr\" — в холодильник;\n- \"fz\" — в морозилку.\n```\n[\"Курица с паприкой + гречка + салат\", \"fr\", \"2 порции · обед дней 1 и 3\"]\n```\n\npack — как разложить. Строк столько же, сколько в out, в том же порядке. Строка — `[контейнеры, пакеты, баночки, \"как разложить\"]`. Первые три — числа, последнее — текст: что и по сколько граммов в каждый.\n```\n[2, 0, 2, \"2 контейнера. В каждый: кусок курицы (≈130 г готовой) и гречка ≈200 г. Морковный салат по 75 г в баночки отдельно.\"]\n```\n\n### 3.4 pull — разморозка\n\nМассив из 4 объектов, по одному на неделю. Ключ — номер дня строкой (\"0\"–\"6\"). Значение — что вечером накануне этого дня переложить из морозилки в холодильник. В дни без разморозки ключа нет.\n```\n[ { \"2\": \"2 котлеты на завтра\", \"5\": \"Пакет плова\" }, {...}, {...}, {...} ]\n```\n\n### 3.5 cookDays\n\nВсегда `[0, 3]`. Не менять.\n\n### 3.6 shop и pantry — покупки\n\nshop — 4 недели. Неделя — массив групп. Группа — `[\"название группы\", [[\"товар\", \"количество\"], ...]]`:\n```\n[\"Мясо и рыба\", [[\"Куриная грудка\", \"500 г\"], [\"Тунец в собственном соку\", \"2 банки\"]]]\n```\n- Название товара — как оно называется на полке магазина: «Куриная грудка», а не «грудка 2 шт».\n- Количество — отдельной строкой, с округлением до реальной упаковки.\n- Цены не указывать.\n\npantry — крупы и запасы на весь месяц, их покупают один раз в неделю 1: `[[\"Гречка\", \"900 г\"], [\"Рис\", \"900 г\"]]`.\n\nСроки годности:\n- Скоропортящееся (молочка, мясо, рыба, свежие овощи, зелень, хлеб) — только в shop той недели, когда оно нужно. Никогда не покупать молочку или свежие овощи заранее на следующие недели.\n- В pantry — только то, что хранится месяц и дольше: крупы, макароны, мука, консервы, специи, мёд, замороженное.\n- Сырое мясо и рыба, нужные во второй готовке недели, приложение само отправит в морозилку при раскладке.\n\n### 3.7 recipes — рецепты\n\nМассив групп: `[\"Название группы\", [рецепт, рецепт, ...]]`. Рецепт — массив из 7 элементов:\n```\n[\"cutlets\",\n \"Куриные котлеты\",\n \"10 шт · 2 шт = 230 ккал · 25 мин\",\n \"Сочные, без жарки и брызг по всей кухне. Половину сразу в морозилку — будущая ты скажет спасибо.\",\n [\"фарш куриный 700 г\", \"кабачок или картофелина\", \"луковица\", \"яйцо\", \"овсянка 30 г\", \"укроп, соль\"],\n [\"Кабачок натри и хорошо отожми: лишняя вода — враг котлеты.\", \"Смешай всё с фаршем…\", \"…\"],\n \"Готовность проверяй ножом: сок прозрачный — можно доставать.\"]\n```\n1. id — латиница, на него ссылаются dishes.recipe и steps[4].\n2. Название.\n3. Мета: «выход · ккал на порцию · время».\n4. Вайб — одна живая фраза о блюде.\n5. Ингредиенты с количеством.\n6. Шаги на «ты», с объяснением, зачем это делать.\n7. Фишка — главный совет.\n\nТон дружелюбный, короткий, можно с лёгкой шуткой. Обращение к пользовательнице в женском роде.\n\n## 4. Как писать шаги готовки (самое важное)\n\nГотовку должен понять человек без рецепта под рукой и без опыта.\n- Заголовок: одно действие в повелительном наклонении, до 6 слов. Например: «Слепи котлеты», «Курицу достань, котлеты поставь».\n- «Подробно»: 1–3 предложения на «ты». В тексте должно быть:\n  - все граммы и объёмы; для воды — в миллилитрах, а не «1:2»;\n  - температура и уровень духовки;\n  - как понять, что готово («сок прозрачный», «нож входит легко»);\n  - что делать с готовым: остудить, куда переложить.\n- Время ожидания в тексте не повторять: его показывает таймер.\n- Если шаг готовит что-то на потом («отложи 3 ложки томатов к пасте»), это пишется в том же шаге.\n- Последние шаги: что выключить, что остудить и как убрать в холодильник или морозилку.\n\n## 5. Требования к содержанию\n\nПитание:\n- 1550–1750 ккал в день. Белки 90–125 г, жиры 40–60 г, углеводы 160–220 г.\n- Каждый день 2 лёгких приёма (250–300 ккал) и 2 плотных (450–600 ккал).\n- Каждый день есть десерт.\n\nРазнообразие:\n- Одно блюдо — не больше 2 раз в неделю и не в соседние дни.\n- Сладкие и несладкие завтраки чередуются.\n\nНельзя:\n- супы, кроме крем-супов;\n- перловку;\n- минтай;\n- свежую рыбу (рыба только консервированная);\n- капусту.\n\nЛогистика:\n- Каждая готовка — не больше часа активного времени.\n- Заготовки в морозилке занимают не больше половины ящика.\n- Бюджет около 3 500 ₽ в неделю, продукты из обычного супермаркета.\n\n## 6. Чек-лист перед отдачей файла\n\n- [ ] format = \"mealplan-menu\", version = 1, id подходит под правило и не равен \"m1\", name заполнено.\n- [ ] Ровно 4 недели × 7 дней × 4 приёма.\n- [ ] У каждого приёма есть id, n, k, p, f, c и s; s — одно из s / w / f / q.\n- [ ] В каждом дне t[0] = сумма k ±10.\n- [ ] Каждый id блюда из weeks есть в dishes.\n- [ ] Каждый dishes.recipe и steps[4] (если не null) есть в recipes.\n- [ ] cooks: 4 × 2. У каждой готовки есть шаги, место — \"Духовка\", \"Плита\" или \"Стол\". pack по длине совпадает с out.\n- [ ] Блюда с s = \"s\" есть в out готовки 1 этой недели, с s = \"w\" — в out готовки 2. Для блюд с s = \"f\" есть заготовка в морозилке и запись в pull накануне.\n- [ ] shop — 4 недели. Всё из need есть в shop своей недели или в pantry.\n- [ ] Калории, БЖУ, повторы и запреты из раздела 5 соблюдены.\n- [ ] JSON валидный.\n\n## 7. Хранение\n\nМеню хранится в браузере, в который его загрузили. На другом устройстве файл нужно загрузить ещё раз. Встроенное Меню 1 есть везде.\n";
function mdToHtml(md){
  const e=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const il=s=>e(s).replace(/`([^`]+)`/g,'<code>$1</code>');
  const L=md.split('\n');let h='',i=0;
  while(i<L.length){const l=L[i];
    if(l.startsWith('```')){let b=[];i++;while(i<L.length&&!L[i].startsWith('```'))b.push(L[i++]);i++;h+=`<pre>${e(b.join('\n'))}</pre>`;continue}
    if(/^#\s/.test(l)){i++;continue}
    let m;if(m=l.match(/^(#{2,3})\s+(.*)/)){h+=m[1].length===2?`<h4>${il(m[2])}</h4>`:`<h5>${il(m[2])}</h5>`;i++;continue}
    if(/^\s*(-|\d+\.)\s/.test(l)){const ol=/^\d+\./.test(l.trim());let items=[];
      while(i<L.length&&/^\s*(-|\d+\.)\s/.test(L[i])){const sub=/^\s{2,}/.test(L[i]);const t=L[i].replace(/^\s*(-|\d+\.)\s+/,'').replace(/^\[ \]\s*/,'☐ ');
        if(sub&&items.length)items[items.length-1].sub.push(t);else items.push({t,sub:[]});i++}
      const tag=ol?'ol':'ul';h+=`<${tag}>${items.map(x=>`<li>${il(x.t)}${x.sub.length?`<ul>${x.sub.map(s=>`<li>${il(s)}</li>`).join('')}</ul>`:''}</li>`).join('')}</${tag}>`;continue}
    if(l.trim()===''){i++;continue}
    h+=`<p>${il(l)}</p>`;i++}
  return h}
const RULES_HTML=mdToHtml(RULES_MD);

const hmFr=q=>{let w=Math.floor(q),f=q-w;const F=[[0,''],[.25,'¼'],[1/3,'⅓'],[.5,'½'],[2/3,'⅔'],[.75,'¾'],[1,'']];let b=F[0];F.forEach(x=>{if(Math.abs(x[0]-f)<Math.abs(b[0]-f))b=x});if(b[0]===1)w++;return {s:(w?w:'')+b[1]||'0',whole:!b[1],w}};
const hmPl=(r,one,few,many)=>{if(!r.whole)return few;const n=r.w%100,m=n%10;return n>10&&n<20?many:m===1?one:m>=2&&m<=4?few:many};
const hmSp=(g,sp)=>{const n=g/sp;if(n<.8){const t=Math.max(1,Math.round(g/(sp/3)));return t+' ч.л.'}const r=n<=6?Math.round(n*2)/2:Math.round(n);return String(r).replace('.5','½').replace(/^0/,'')+' ст.л.'};
function hmOf(g,unit,ctx){ctx=ctx.toLowerCase();const e=HM_T.find(x=>x[0].test(ctx));if(!e)return '';const o=e[1];
  if(unit==='мл'&&!o.liq)return '';
  if(o.pc){if(unit!=='г')return '';const q=Math.round(g/o.pc*2)/2||.5;return '~'+String(q).replace('.5','½').replace(/^0/,'')+' шт'}
  if(o.pack&&g>=150){const q=Math.round(g/o.pack*2)/2;return `~${String(q).replace('.5','½').replace(/^0/,'')} ${q<=1?'пачка':q<5?'пачки':'пачек'} по ${o.pack} г`}
  if(o.gl&&g>=(o.liq?60:o.gl*.45)){const r=hmFr(g/o.gl);return r.s+' '+hmPl(r,'стакан','стакана','стаканов')+(o.sfx||'')}
  if(o.sp)return hmSp(g,o.sp)+(o.sfx||'');
  if(o.hand)return '~'+Math.max(1,Math.round(g/o.hand))+' горсть';
  return ''}
function homeMeasures(root){if(!root)return;const T=/\d\s?(г|мл)(?![а-яёa-z])/i;const nodes=[];
  const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;if(!p||p.closest('script,style,textarea,input,select,.shoptbl,.hm,.no-hm,svg,.mono'))return 2;return T.test(n.data)?1:3}});
  while(tw.nextNode())nodes.push(tw.currentNode);
  nodes.forEach(n=>{const s=n.data;const RE=/(\d+(?:[.,]\d+)?)\s?(г|мл)(?![а-яёa-z])/gi;let m,last=0;const fr=document.createDocumentFragment();let hit=0;
    while(m=RE.exec(s)){const g=parseFloat(m[1].replace(',','.'));const end=m.index+m[0].length;
      const after=s.slice(end).split(/[.,;:()\d—–]/)[0].trim().split(/\s+/).slice(0,3).join(' ');
      const before=s.slice(0,m.index).split(/[.,;:()\d—–«»]/).pop().trim().split(/\s+/).slice(-3).join(' ');
      const h=hmOf(g,m[2].toLowerCase(),after)||hmOf(g,m[2].toLowerCase(),before);
      if(!h)continue;hit=1;fr.append(s.slice(last,end));const sp=document.createElement('span');sp.className='hm';sp.textContent=` (${h})`;fr.append(sp);last=end}
    if(!hit)return;fr.append(s.slice(last));n.replaceWith(fr)})}

/* валидация импорта: возвращает список понятных ошибок */
function validateMenu(m){
  const E=[];const isArr=Array.isArray,isNum=x=>typeof x==='number'&&isFinite(x),isStr=x=>typeof x==='string'&&x.trim()!=='';
  if(!m||typeof m!=='object')return ['Файл не похож на меню: внутри должен быть JSON-объект.'];
  if(m.format!==MENU_FORMAT)E.push(`Поле format должно быть "${MENU_FORMAT}".`);
  if(m.version!==MENU_VERSION)E.push(`Поле version должно быть ${MENU_VERSION}.`);
  if(!isStr(m.id)||!/^[a-z0-9-]{2,24}$/.test(m.id))E.push('id — латиница, цифры и дефис, 2–24 символа. Например "m2-winter".');
  else if(m.id==='m1')E.push('id "m1" занят встроенным меню, выбери другой.');
  if(!isStr(m.name))E.push('Нужно название меню в поле name.');
  if(!isArr(m.weeks)||m.weeks.length!==4)E.push('weeks — ровно 4 недели.');
  else m.weeks.forEach((w,wi)=>{if(!w||!isArr(w.days)||w.days.length!==7){E.push(`Неделя ${wi+1}: нужно 7 дней.`);return}
    w.days.forEach((d,di)=>{const p=`Неделя ${wi+1}, день ${di+1}`;
      if(!isArr(d.meals)||d.meals.length!==4){E.push(`${p}: нужно 4 приёма (завтрак, обед, полдник, ужин).`);return}
      d.meals.forEach((x,mi)=>{if(!x||!isStr(x.id)||!isStr(x.n)||![x.k,x.p,x.f,x.c].every(isNum)||!['s','w','f','q'].includes(x.s))E.push(`${p}, ${SLOTS[mi].toLowerCase()}: нужны id, n, k, p, f, c и s (s, w, f или q).`)});
      if(!isArr(d.t)||d.t.length!==4||!d.t.every(isNum))E.push(`${p}: t — итог дня [ккал, белки, жиры, углеводы].`);

  if(/хлеб/.test(n))return {p:'fz',note:'Нарежь и заморозь ломтиками, достаёшь по одному — неделю в пакете хлеб не проживёт'};
  if(RAW.test(n)&&!/консерв|соку/.test(n)){const a=needOf(w,0,name),b=needOf(w,1,name);
    const a2=a&&rawWait(w,0)>1;/* сырое мясо в холодильнике — максимум 1–2 дня */

/* sheet drag: 1:1 tracking, velocity handoff, momentum projection, rubber-band, springs */
const project=(v,d=0.998)=>(v/1000)*d/(1-d);
const rubber=(x,dim,c=0.55)=>(x*dim*c)/(dim+c*Math.abs(x));
let drag=null,sp=null,cur=0;
function setY(y){cur=y;body.style.transform=y?`translateY(${y}px)`:''}
function springTo(to,v0,{response=.35,damping=1}={},done){
  cancelAnimationFrame(sp);let x=cur,v=v0,last=performance.now();
  const k=Math.pow(2*Math.PI/response,2),c=4*Math.PI*damping/response;
  const step=now=>{let dt=Math.min(.032,(now-last)/1000);last=now;
    for(let i=0;i<4;i++){const h=dt/4;v+=(-k*(x-to)-c*v)*h;x+=v*h}
    setY(x);
    if(Math.abs(v)<20&&Math.abs(x-to)<.5){setY(to);sp=null;done&&done();return}
    sp=requestAnimationFrame(step)};
  sp=requestAnimationFrame(step);
}

  if(!fromTop&&!onGrab)return;
  if(sp){cancelAnimationFrame(sp);sp=null}           // interrupt: grab from the live value
  const y=e.touches[0].clientY;
  drag={y0:y-cur,hist:[[performance.now(),y]],moved:false};
  body.classList.add('dragging');

body.addEventListener('touchmove',e=>{

  if(!drag.moved&&dy<0&&body.scrollTop<=0&&!e.target.closest('.grab,.shead')&&body.scrollHeight>body.clientHeight){drag=null;body.classList.remove('dragging');return}
  drag.moved=true;
  if(dy<0)dy=-rubber(-dy,body.offsetHeight);
  setY(dy);drag.hist.push([performance.now(),y]);if(drag.hist.length>6)drag.hist.shift();

function endDrag(){
  if(!drag)return;const h=drag.hist,d=drag;drag=null;
  if(!d.moved){body.classList.remove('dragging');if(cur)springTo(0,0,{},()=>body.classList.remove('dragging'));return}
  const a=h[0],b=h[h.length-1];const v=b[0]>a[0]?(b[1]-a[1])/((b[0]-a[0])/1000):0;   // px/s
